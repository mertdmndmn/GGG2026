<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="30%" stop-color="#FFD700"/>
      <stop offset="60%" stop-color="#C8960C"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A0"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#A0700A"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>
  
  <!-- Outer decorative ring -->
  <circle cx="256" cy="256" r="242" fill="none" stroke="#FFD700" stroke-width="3" opacity="0.4"/>
  <circle cx="256" cy="256" r="235" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.2"/>

  <!-- === WORLD CUP TROPHY === -->
  
  <!-- Base plate -->
  <rect x="196" y="368" width="120" height="16" rx="8" fill="url(#goldGrad2)"/>
  <rect x="178" y="382" width="156" height="12" rx="6" fill="url(#goldGrad2)"/>
  
  <!-- Stem -->
  <rect x="238" y="330" width="36" height="42" rx="6" fill="url(#goldGrad2)"/>
  <!-- Stem knob -->
  <ellipse cx="256" cy="330" rx="28" ry="10" fill="url(#goldGrad)"/>
  
  <!-- Cup body -->
  <path d="M190 150 L322 150 L305 295 Q285 328 256 335 Q227 328 207 295 Z" 
        fill="url(#goldGrad2)" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- Cup inner shadow -->
  <path d="M210 155 L302 155 L288 285 Q272 315 256 320 Q240 315 224 285 Z" 
        fill="#C8960C" opacity="0.3"/>
  
  <!-- Cup rim top -->
  <ellipse cx="256" cy="150" rx="66" ry="14" fill="url(#goldGrad)"/>
  
  <!-- Left handle -->
  <path d="M192 160 Q148 160 145 205 Q142 248 207 278" 
        fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round"/>
  <path d="M192 160 Q148 160 145 205 Q142 248 207 278" 
        fill="none" stroke="url(#goldGrad2)" stroke-width="10" stroke-linecap="round"/>

  <!-- Right handle -->
  <path d="M320 160 Q364 160 367 205 Q370 248 305 278" 
        fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round"/>
  <path d="M320 160 Q364 160 367 205 Q370 248 305 278" 
        fill="none" stroke="url(#goldGrad2)" stroke-width="10" stroke-linecap="round"/>

  <!-- Football on top of cup -->
  <circle cx="256" cy="122" r="32" fill="#f0f0f0" filter="url(#glow)"/>
  <!-- Football pentagon patches -->
  <circle cx="256" cy="122" r="32" fill="none" stroke="#ddd" stroke-width="1"/>
  <polygon points="256,98 267,107 263,120 249,120 245,107" fill="#222" opacity="0.8"/>
  <polygon points="280,112 287,124 278,133 268,128 268,115" fill="#222" opacity="0.5"/>
  <polygon points="232,112 245,115 245,128 235,133 226,124" fill="#222" opacity="0.5"/>
  <polygon points="263,134 270,144 260,148 252,148 242,144 249,134" fill="#222" opacity="0.4"/>

  <!-- Shine on cup -->
  <path d="M215 165 Q225 200 220 240" stroke="white" stroke-width="4" fill="none" opacity="0.2" stroke-linecap="round"/>
  <path d="M228 158 Q234 175 232 195" stroke="white" stroke-width="2.5" fill="none" opacity="0.15" stroke-linecap="round"/>

  <!-- GGG text -->
  <text x="256" y="458" 
        text-anchor="middle" 
        font-family="Arial Black, Impact, sans-serif" 
        font-weight="900"
        font-size="82"
        letter-spacing="8"
        fill="url(#goldGrad)"
        filter="url(#glow)">GGG</text>
</svg>
